name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test pigeons
      - run: flutter analyze
      - run: flutter test
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build apk --debug
        working-directory: example
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disk-size: 4096M
          working-directory: example
          script: flutter test integration_test

  darwin:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build ios --simulator --debug
        working-directory: example
      - run: flutter build macos --debug
        working-directory: example
      - name: Integration tests on macOS
        run: flutter test integration_test -d macos
        working-directory: example
      - name: Integration tests on the iOS simulator
        working-directory: example
        timeout-minutes: 35
        run: |
          # Use an iPhone from the newest iOS runtime installed on the runner.
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          def version(runtime):
              return [int(n) for n in re.findall(r'\d+', runtime.split('iOS')[-1])]
          ios = sorted((r for r in devices if 'iOS' in r), key=version, reverse=True)
          print(next(d['udid'] for r in ios for d in devices[r] if d['name'].startswith('iPhone')))
          ")
          # bootstatus can end in an error state while still exiting 0, which
          # left flutter test waiting on an app that never started. Check the
          # device really booted, and erase and retry once if it didn't.
          booted() { xcrun simctl list devices | grep "$UDID" | grep -q "(Booted)"; }
          for attempt in 1 2; do
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            booted && break
            echo "Simulator $UDID did not boot (attempt $attempt)"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl erase "$UDID"
          done
          booted
          # flutter test sometimes hangs after "Xcode build done" without
          # ever starting the tests. Give each attempt a time limit, keep a
          # verbose log to see where it stopped, and retry once on a freshly
          # booted simulator.
          for attempt in 1 2; do
            # flutter test prints nothing while Xcode builds for the simulator
            # (several minutes on the runner), so say so rather than look stuck.
            echo "Simulator booted. Building the app for it and running the tests (attempt $attempt)..."
            status=0
            # macOS has no timeout(1); perl's alarm ends the run after 12 minutes.
            perl -e 'alarm shift; exec @ARGV' 720 \
              flutter test integration_test -d "$UDID" -v > "flutter-test-$attempt.log" 2>&1 || status=$?
            grep -E '^\s*(✅|❌|🎉|[0-9]+ tests? (passed|failed))|Some tests failed|Test failed' "flutter-test-$attempt.log" || true
            [ "$status" -eq 0 ] && exit 0
            echo "::warning::iOS integration tests attempt $attempt ended with status $status. Last lines of the verbose log:"
            tail -n 150 "flutter-test-$attempt.log"
            # 142 is SIGALRM: the run hung. Any other failure is a real one.
            [ "$status" -eq 142 ] || exit "$status"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID"
          done
          exit 1
