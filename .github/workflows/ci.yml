name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test pigeons
      - run: flutter analyze
      - run: flutter test
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build apk --debug
        working-directory: example
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disk-size: 4096M
          working-directory: example
          script: flutter test integration_test

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build ios --simulator --debug
        working-directory: example
      - run: flutter build macos --debug
        working-directory: example
      - name: Integration tests on macOS
        run: flutter test integration_test -d macos
        working-directory: example
      - name: Integration tests on the iOS simulator
        working-directory: example
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))
          ")
          xcrun simctl bootstatus "$UDID" -b
          flutter test integration_test -d "$UDID"
