name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test example/integration_test pigeons
      - run: flutter analyze
      - run: flutter test
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build apk --debug
        working-directory: example
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disk-size: 4096M
          working-directory: example
          script: flutter test integration_test

  darwin:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter build ios --simulator --debug
        working-directory: example
      - run: flutter build macos --debug
        working-directory: example
      - name: Integration tests on macOS
        run: flutter test integration_test -d macos
        working-directory: example
      - name: Integration tests on the iOS simulator
        working-directory: example
        run: |
          # Use an iPhone from the newest iOS runtime installed on the runner.
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, re, sys
          devices = json.load(sys.stdin)['devices']
          def version(runtime):
              return [int(n) for n in re.findall(r'\d+', runtime.split('iOS')[-1])]
          ios = sorted((r for r in devices if 'iOS' in r), key=version, reverse=True)
          print(next(d['udid'] for r in ios for d in devices[r] if d['name'].startswith('iPhone')))
          ")
          # bootstatus can end in an error state while still exiting 0, which
          # left flutter test waiting on an app that never started. Check the
          # device really booted, and erase and retry once if it didn't.
          booted() { xcrun simctl list devices | grep "$UDID" | grep -q "(Booted)"; }
          for attempt in 1 2; do
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            booted && break
            echo "Simulator $UDID did not boot (attempt $attempt)"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl erase "$UDID"
          done
          booted
          flutter test integration_test -d "$UDID"
