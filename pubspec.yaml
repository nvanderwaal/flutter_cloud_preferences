name: flutter_cloud_preferences
description: >-
  Key-value preferences that survive reinstalls and new devices, backed up to
  iCloud key-value storage on iOS and macOS and Android Auto Backup on Android.
version: 0.1.0
repository: https://github.com/nvanderwaal/flutter_cloud_preferences
issue_tracker: https://github.com/nvanderwaal/flutter_cloud_preferences/issues
topics:
  - preferences
  - icloud
  - backup
  - storage
  - sync

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      android:
        package: io.github.nvanderwaal.flutter_cloud_preferences
        pluginClass: FlutterCloudPreferencesPlugin
      ios:
        pluginClass: FlutterCloudPreferencesPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterCloudPreferencesPlugin
        sharedDarwinSource: true
